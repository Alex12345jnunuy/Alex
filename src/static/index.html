<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Pila Reservas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chat-widget">
        <div id="chat-header">Chatbot Pila - Reservas</div>
        <div id="chat-body">
            <div class="message bot-message">Olá! Como posso ajudar com a sua reserva?</div>
            <!-- Messages will be appended here -->
        </div>
        <div id="chat-input-area">
            <input type="text" id="user-input" placeholder="Escreva a sua mensagem...">
            <button id="send-button">Enviar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
